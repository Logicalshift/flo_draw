[package]
name        = "flo_render_canvas"
version     = "0.4.0"
authors     = ["Andrew Hunter"]
license     = "Apache-2.0"
edition     = "2018"
repository  = "https://github.com/Logicalshift/flo_draw"
description = "Converts flo_canvas streams to flo_render streams"
categories  = [ "graphics", "rendering", "rendering::engine" ]

include     = [ "Cargo.toml", "src/**/*", "svg/**/*" ]

[features]
default         = [ "render-software" ]
opengl          = [ "flo_render/opengl" ]
osx-metal       = [ "flo_render/osx-metal" ]
render-wgpu     = [ "flo_render/render-wgpu" ]
render-software = [ "flo_render_software" ]
profile         = [ "flo_render/profile" ]

scenery         = [ "flo_canvas/scenery" ]

[dependencies]
flo_render          = "0.4"
flo_canvas          = "0.4"
flo_stream          = "0.7"
futures             = "0.3"
desync              = "0.9"
lyon                = "1.0"
num_cpus            = "1.13"
flo_render_software = { version = "0.4", optional = true }

[dev-dependencies]
png         = "0.18"
once_cell   = "1.18"
winit       = "0.30"
flo_canvas  = { version = "0.4", features = [ "outline-fonts" ] }